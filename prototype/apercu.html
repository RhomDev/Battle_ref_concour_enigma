<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111c20">
  <title>Battle Ref Arena — Plateau de combat</title>
  <link rel="stylesheet" href="arena.css">
  <script src="catalogue/apercu-data.js" defer></script>
  <script src="arena.js" defer></script>
</head>
<body>
  <main class="battle" aria-label="Plateau de combat">
    <header class="battle-header">
      <h1 class="wordmark">Battle Ref <span>Arena</span></h1>
      <nav class="game-menu" aria-label="Commandes de la démo">
        <button class="metal-button" type="button" id="show-catalogue">Cartes</button>
        <button class="metal-button" type="button" id="show-options">Options</button>
        <button class="metal-button fullscreen" type="button" id="fullscreen" aria-label="Plein écran" title="Plein écran" hidden>⛶</button>
      </nav>
    </header>

    <section class="field" aria-label="Terrain">
      <div class="ranks enemy">
        <div class="team">
          <span class="team-name">Adversaire</span>
          <span class="life" aria-label="12 points de vie adverses"><b>12</b><span>PV</span></span>
        </div>
        <div class="lane" id="ennemi" aria-label="Personnages adverses"></div>
      </div>
      <div class="turn" aria-label="Tour 5, à vous de jouer"><span>Tour 5</span></div>
      <div class="ranks ally">
        <div class="team">
          <span class="team-name">Votre camp</span>
          <span class="life" aria-label="Vos points de vie, 15"><b>15</b><span>PV</span></span>
        </div>
        <div class="lane" id="allie" aria-label="Vos personnages"></div>
      </div>
      <div class="event" id="event" aria-atomic="true" role="status"></div>
    </section>

    <section class="command" aria-label="Votre tour">
      <div class="energy-meter" aria-label="Énergie disponible">
        <span class="energy-caption">Énergie</span>
        <span class="energy-gems" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span class="energy-count"><b id="energy">4</b> / 5</span>
      </div>
      <div class="lane hand-cards" id="main" aria-label="Cartes en main"></div>
      <button class="metal-button activate" type="button" id="activate" disabled>Jouer la Ref</button>
    </section>
  </main>

  <dialog class="game-dialog inspector" id="inspector" aria-labelledby="selection-heading">
    <header class="dialog-header">
      <h2 id="selection-heading">Carte sélectionnée</h2>
      <form method="dialog"><button class="metal-button close" aria-label="Fermer la carte" autofocus>×</button></form>
    </header>
    <div id="detail"></div>
    <button class="metal-button activate" type="button" id="activate-card" disabled>Jouer la Ref</button>
  </dialog>

  <dialog class="game-dialog catalogue" id="catalogue" aria-labelledby="catalogue-heading">
    <header class="dialog-header">
      <h2 id="catalogue-heading">Catalogue des cartes</h2>
      <form method="dialog"><button class="metal-button close" aria-label="Fermer le catalogue" autofocus>×</button></form>
    </header>
    <div class="gallery-grid" id="gallery"></div>
  </dialog>

  <dialog class="game-dialog options" id="options" aria-labelledby="options-heading">
    <header class="dialog-header">
      <h2 id="options-heading">Options</h2>
      <form method="dialog"><button class="metal-button close" aria-label="Fermer les options" autofocus>×</button></form>
    </header>
    <div class="option-controls">
      <button class="metal-button" id="son" type="button" aria-pressed="false">Activer le son</button>
      <label class="volume">Volume <input id="volume" type="range" min="0" max="100" value="35"></label>
      <button class="metal-button" type="button" id="reset">Rejouer la scène</button>
    </div>
    <p class="detail-note" id="audio-status" role="status" hidden>Le son est bloqué par le navigateur.</p>
    <details class="credits" id="credits"><summary>Crédits des photographies</summary><ul id="credit-list"></ul></details>
  </dialog>
</body>
</html>
