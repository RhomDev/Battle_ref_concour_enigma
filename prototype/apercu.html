<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Battle Ref Arena — Plateau de combat</title>
  <link rel="stylesheet" href="arena.css">
  <script src="catalogue/apercu-data.js" defer></script>
  <script src="arena.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a href="apercu.html" aria-label="Battle Ref Arena, plateau">BATTLE REF <span>ARENA</span></a>
      <span class="scene-label">Démonstration</span>
    </div>
    <nav class="settings" aria-label="Options du plateau">
      <a href="#catalogue">Catalogue</a>
      <a href="#credits">Crédits</a>
      <button id="son" type="button" aria-pressed="false">Activer le son</button>
      <label class="volume"><span>Volume</span><input id="volume" type="range" min="0" max="100" value="35"></label>
    </nav>
  </header>
  <main class="layout">
    <section class="arena" aria-label="Plateau de combat">
      <div class="table">
        <header class="team enemy">
          <h1>Adversaire</h1>
          <div class="team-score">
            <meter aria-label="PV adverses" min="0" max="18" value="12">12 sur 18</meter>
            <span class="life"><b>12</b> PV</span>
          </div>
        </header>
        <div class="lane" id="ennemi" aria-label="Personnages adverses"></div>
        <div class="centerline" aria-label="Votre tour, tour 5">
          <span aria-hidden="true"></span><strong>Tour 5</strong><span aria-hidden="true"></span>
        </div>
        <div class="lane" id="allie" aria-label="Vos personnages"></div>
        <footer class="team ally">
          <h2>Votre camp <small>À vous de jouer</small></h2>
          <div class="team-score">
            <meter aria-label="Vos PV" min="0" max="18" value="15">15 sur 18</meter>
            <span class="life"><b>15</b> PV</span>
          </div>
        </footer>
      </div>
      <section class="hand" aria-labelledby="hand-heading">
        <div class="hand-head">
          <h2 id="hand-heading">En main</h2>
          <span class="energy" aria-label="Énergie disponible"><b id="energy">4</b> / 5 ⚡</span>
        </div>
        <div class="lane hand-cards" id="main" aria-label="Cartes en main"></div>
      </section>
    </section>
    <aside class="sidebar" aria-labelledby="selection-heading">
      <h2 id="selection-heading">Carte sélectionnée</h2>
      <div id="detail"></div>
      <p id="event" class="event" role="status">Sélectionnez une carte pour l’inspecter.</p>
      <button class="activate" type="button" id="activate" disabled>Jouer la Ref</button>
      <button class="reset" type="button" id="reset">Réinitialiser la scène</button>
    </aside>
  </main>
  <section class="gallery" id="catalogue" aria-labelledby="catalogue-heading">
    <details><summary id="catalogue-heading">Catalogue des 15 cartes</summary><div id="gallery" class="gallery-grid"></div></details>
  </section>
  <footer class="credits" id="credits"><h2>Crédits des photographies</h2><ul id="credit-list"></ul></footer>
</body>
</html>
